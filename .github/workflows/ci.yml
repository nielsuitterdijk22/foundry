name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: lint
        run: uvx ruff check --select E,F,W,B --ignore E501 src tests
      - name: unit tests
        run: PYTHONPATH=src uv run --no-project --python 3.12 python -m unittest discover -s tests -v
