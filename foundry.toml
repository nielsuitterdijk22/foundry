# foundry.toml — the single place to configure foundry.
# Paths may start with ~. Durations are minutes unless stated.

[paths]
repos = "~/Documents/Repos"        # where scaffolded / adopted projects live
state = "~/.foundry"               # logs, pid files, run state, deploy keys, metrics

[model]
# Any MLX model on Hugging Face (or a local path). Swap models here, then `foundry serve restart`.
id = "mlx-community/Devstral-Small-2-24B-Instruct-2512-4bit"
context = 40960                    # tokens OpenCode may use before it summarises the session (Devstral
                                   # supports 131072). Was 64k, but a single near-64k generation's KV cache
                                   # on top of the model (~15 GB), prompt cache and Docker kept OOMing the
                                   # Metal command buffer on 48 GB (crashes every ~2h). 40k caps the live KV
                                   # for headroom; OpenCode summarises a little sooner.
max_output = 8192                  # max tokens per response; caps runaway generations, which
                                   # can also crash mlx-lm (Metal buffer-count limit, mlx-lm#1662)
thinking = false                   # Devstral has no thinking mode; the template ignores this flag
# Override the model's built-in chat template (Jinja file, path relative to the repo root).
# Empty = use the model's own. Devstral's stock template raises "roles must alternate" on the
# non-alternating histories OpenCode sends; this copy drops that guard, keeping tool calling.
chat_template = "src/foundry/chat_templates/devstral-lenient.jinja"

# Sampling. Mistral recommends temperature 0.15 for Devstral (agentic coding); top_k/min_p off.
[model.sampling]
temperature = 0.15
top_p = 1.0
top_k = 0
min_p = 0.0

[server]
host = "127.0.0.1"
port = 8080
prompt_cache_bytes = 6_000_000_000 # caps the server's prompt KV cache (prevents Metal OOM).
                                   # Was 8 GB; cut to leave GPU headroom — the 24B 4-bit model
                                   # (~15 GB) + KV for a 64k context + Docker (6 GB) was OOMing
                                   # the Metal command buffer mid-generation on 48 GB.
startup_timeout = 600              # seconds to wait for the model to load
extra_args = []                    # passed verbatim to mlx_lm.server

[run]
max_attempts = 3                   # failed attempts before a task is parked
task_timeout = 60                  # wall-clock cap per attempt
stall_timeout = 20                 # stop an attempt that changed no file in this many minutes
task_token_budget = 1_500_000      # new tokens processed per attempt (uncached input + output)
check_timeout = 20                 # cap for one ./check run
protected = ["SUITE.md", "MISSION.md", "FEATURES.md", "USER_STORIES.md"]

[sandbox]
image = "foundry-agent"
proxy_image = "foundry-proxy"
cpus = 6
memory = "6g"
# Hosts the agent may reach (through the allowlist proxy). The model server is added automatically.
allow = [
  # Go
  "proxy.golang.org", "sum.golang.org", "storage.googleapis.com",
  # Rust
  "index.crates.io", "static.crates.io", "crates.io",
  # npm
  "registry.npmjs.org",
  # Python (for tooling some projects use)
  "pypi.org", "files.pythonhosted.org",
]

[showcase]
# Private GitHub repo (under github.owner) whose README is regenerated after every iteration:
# what needs you, product status, latest merges with real demo output. Local copy:
# ~/.foundry/showcase/README.md. Created on first publish.
repo = "foundry-showcase"

[github]
owner = ""                         # empty = the account `gh` is logged in as
private = true
